name: Release

# A maintainer cuts a release from main (Actions → Release → Run workflow).
# This workflow cuts CHANGELOG [Unreleased] into a version and bumps
# package.json / package-lock.json (Added → minor; Fixed/Changed → patch;
# never major before 1.0), tags vX.Y.Z, opens a GitHub Release and publishes
# the image to GHCR from that commit. Merges to main do not release.
# After publishing, the deploy job rolls the Azure Container App to that image
# once someone approves GitHub Environment `prod`. It only swaps the image
# (`az containerapp update`); Terraform still owns the infrastructure and this
# workflow never applies it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# Actions are pinned to commit SHAs (with the version in a comment) so a
# moved or compromised tag can't change what runs here.

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  bump:
    name: Version bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cut.outputs.version }}
      tag: ${{ steps.cut.outputs.tag }}
      sha: ${{ steps.cut.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test before cutting a release
        run: |
          npm run typecheck
          npm run test:unit

      - name: Cut Unreleased into a version
        id: cut
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Cut releases from main (got ${GITHUB_REF_NAME})."
            exit 1
          fi
          notes="${RUNNER_TEMP}/release-notes.md"
          before="$(git rev-parse HEAD)"
          subject="$(git log -1 --pretty=%s)"
          npm run --silent bump -- --commit --notes-file "${notes}"
          after="$(git rev-parse HEAD)"
          version="$(node -p "require('./package.json').version")"
          if [ "${before}" = "${after}" ]; then
            if [ "${subject}" != "Release v${version}" ]; then
              echo "::error::No Unreleased notes in CHANGELOG.md. Add entries, merge to main, then run this workflow."
              exit 1
            fi
            echo "HEAD is already Release v${version}; continuing without another bump."
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
            git push origin --tags
          fi
          if [ ! -s "${notes}" ]; then
            echo "::error::Release notes for v${version} are empty."
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "GitHub Release v${version} already exists."
          else
            gh release create "v${version}" \
              --title "v${version}" \
              --notes-file "${notes}" \
              --target "${sha}"
          fi

  publish:
    name: Publish GHCR
    needs: bump
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.bump.outputs.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        env:
          SHA: ${{ needs.bump.outputs.sha }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          pin="${IMAGE_NAME}:${SHA}"
          tags="${pin},${IMAGE_NAME}:v${VERSION},${IMAGE_NAME}:latest"
          echo "pin=${pin}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${tags}"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fail if the image contains secrets
        env:
          PIN: ${{ steps.meta.outputs.pin }}
        run: |
          docker pull "${PIN}"
          if docker run --rm --entrypoint sh "${PIN}" -c 'test -e /app/.env'; then
            echo "::error::Image ${PIN} contains .env. Do not deploy it."
            exit 1
          fi

      # GitHub has no REST endpoint to change a package's visibility, so this
      # can't be automated. Azure pulls anonymously (infra/container_app.tf has
      # no registry block), so fail here, before deploy, if the package is private.
      - name: Check the image can be pulled anonymously
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ needs.bump.outputs.sha }}
        run: |
          set -euo pipefail
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r .token)"
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${REPO}/manifests/${SHA}")"
          if [ "${status}" != "200" ]; then
            echo "::error::Anonymous pull of ghcr.io/${REPO}:${SHA} returned ${status}. Make the package public once: GitHub → Packages → spacestate → Package settings → Change visibility → Public. Then re-run this workflow."
            exit 1
          fi

  deploy:
    name: Deploy to Azure
    needs: [bump, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: pixelbar-spacestate
      APP_NAME: spacestate
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the Container App to the released image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.bump.outputs.sha }}
        run: |
          set -euo pipefail
          az containerapp update -g "${RESOURCE_GROUP}" -n "${APP_NAME}" --image "${IMAGE}" -o none
          running="$(az containerapp show -g "${RESOURCE_GROUP}" -n "${APP_NAME}" \
            --query 'properties.template.containers[0].image' -o tsv)"
          if [ "${running}" != "${IMAGE}" ]; then
            echo "::error::Expected ${IMAGE}, app is configured with ${running}."
            exit 1
          fi
          echo "Rolled ${APP_NAME} to ${IMAGE}."

      - name: Wait for /healthz
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show -g "${RESOURCE_GROUP}" -n "${APP_NAME}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)"
          # Scale-to-zero: the first request wakes a replica, so retry.
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 "https://${fqdn}/healthz" >/dev/null; then
              echo "https://${fqdn}/healthz is healthy."
              exit 0
            fi
            echo "Not healthy yet (attempt ${attempt}); waiting."
            sleep 10
          done
          echo "::error::https://${fqdn}/healthz did not become healthy. Roll back by re-running the previous release's image: az containerapp update --image ghcr.io/${{ github.repository }}:<previous-sha>"
          exit 1
