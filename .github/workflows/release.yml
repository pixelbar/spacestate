name: Release

# A maintainer cuts a release from main (Actions → Release → Run workflow).
# This workflow cuts CHANGELOG [Unreleased] into a version and bumps
# package.json / package-lock.json (Added → minor; Fixed/Changed → patch;
# never major before 1.0), tags vX.Y.Z, opens a GitHub Release and publishes
# the image to GHCR from that commit. Merges to main do not release.
# Deploying is a separate, manual `terraform apply` with the new image tag
# (see README); this workflow does not touch Azure.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# Actions are pinned to commit SHAs (with the version in a comment) so a
# moved or compromised tag can't change what runs here.

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  bump:
    name: Version bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cut.outputs.version }}
      tag: ${{ steps.cut.outputs.tag }}
      sha: ${{ steps.cut.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test before cutting a release
        run: |
          npm run typecheck
          npm run test:unit

      - name: Cut Unreleased into a version
        id: cut
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Cut releases from main (got ${GITHUB_REF_NAME})."
            exit 1
          fi
          notes="${RUNNER_TEMP}/release-notes.md"
          before="$(git rev-parse HEAD)"
          subject="$(git log -1 --pretty=%s)"
          npm run --silent bump -- --commit --notes-file "${notes}"
          after="$(git rev-parse HEAD)"
          version="$(node -p "require('./package.json').version")"
          if [ "${before}" = "${after}" ]; then
            if [ "${subject}" != "Release v${version}" ]; then
              echo "::error::No Unreleased notes in CHANGELOG.md. Add entries, merge to main, then run this workflow."
              exit 1
            fi
            echo "HEAD is already Release v${version}; continuing without another bump."
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
            git push origin --tags
          fi
          if [ ! -s "${notes}" ]; then
            echo "::error::Release notes for v${version} are empty."
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "GitHub Release v${version} already exists."
          else
            gh release create "v${version}" \
              --title "v${version}" \
              --notes-file "${notes}" \
              --target "${sha}"
          fi

  publish:
    name: Publish GHCR
    needs: bump
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.bump.outputs.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        env:
          SHA: ${{ needs.bump.outputs.sha }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          pin="${IMAGE_NAME}:${SHA}"
          tags="${pin},${IMAGE_NAME}:v${VERSION},${IMAGE_NAME}:latest"
          echo "pin=${pin}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${tags}"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fail if the image contains secrets
        env:
          PIN: ${{ steps.meta.outputs.pin }}
        run: |
          docker pull "${PIN}"
          if docker run --rm --entrypoint sh "${PIN}" -c 'test -e /app/.env'; then
            echo "::error::Image ${PIN} contains .env. Do not deploy it."
            exit 1
          fi

      - name: Make GHCR package public (no secrets in the image)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Azure Container Apps pulls the image anonymously (infra/container_app.tf
          # has no registry block), so the package must be public. The default
          # token may lack package-admin; then flip it once in the GitHub UI.
          package="/orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}"
          for attempt in 1 2 3; do
            if gh api --method PATCH -H "Accept: application/vnd.github+json" \
              "${package}" -f visibility=public; then
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Could not set ghcr.io/${{ github.repository }} public. A maintainer must: GitHub → Packages → spacestate → Package settings → Change visibility → Public."
