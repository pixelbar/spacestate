<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixelbar spacestate API</title>
    <meta name="description" content="HTTP API reference for Pixelbar's space-state and SpaceAPI service." />
    <meta name="theme-color" content="#06060b" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%2306060b'/%3E%3Crect x='1' y='1' width='3' height='3' fill='%23ff3dd6'/%3E%3Crect x='4' y='4' width='3' height='3' fill='%2300e5ff'/%3E%3C/svg%3E"
    />

    <!-- The three faces of the pixelbar.nl/pixel design system. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Pixelify+Sans:wght@400..700&display=swap"
    />

    <style>
      /*
       * Pixel design tokens, lifted verbatim from pixelbar.nl/pixel so the two
       * sites stay in step: edit them there first, then mirror them here.
       */
      .light-mode {
        --bg: #f6f6fa;
        --surface: #ffffff;
        --surface-raised: #ececf3;
        --border: #d6d6e4;
        --border-strong: #7a7a96;
        --ink: #0a0a12;
        --ink-muted: #4d4d66;
        --ink-faint: #5c5c78;
        --link: #1d4fd8;
        --core: #0a0a12;
        --spectrum-cyan: #006b7d;
        --spectrum-blue: #1d4fd8;
        --spectrum-violet: #7c1fd6;
        --spectrum-magenta: #b8128f;
        --spectrum-red: #c8102e;
        --spectrum-orange: #9c4c00;
        --spectrum-yellow: #716000;
        --spectrum-green: #0d722a;
      }
      .dark-mode {
        --bg: #06060b;
        --surface: #0e0e18;
        --surface-raised: #171726;
        --border: #2c2c42;
        --border-strong: #6a6a8e;
        --ink: #f3f3fb;
        --ink-muted: #a6a6c0;
        --ink-faint: #8a8aac;
        --link: #5ee9ff;
        --core: #ffffff;
        --spectrum-cyan: #00e5ff;
        --spectrum-blue: #4d7dff;
        --spectrum-violet: #a855ff;
        --spectrum-magenta: #ff3dd6;
        --spectrum-red: #ff4058;
        --spectrum-orange: #ff8a1f;
        --spectrum-yellow: #ffe81a;
        --spectrum-green: #33ff66;
      }

      /* Pixel is a square, hairline-bordered system: 2px corners, 1px edges. */
      :root {
        --scalar-radius: 2px;
        --scalar-radius-max: 2px;
        --scalar-border-width: 1px;
        --scalar-font: "IBM Plex Sans", system-ui, sans-serif;
        --scalar-font-code: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      }

      /* Map the tokens onto Scalar's palette. */
      .light-mode,
      .dark-mode {
        --scalar-background-1: var(--surface);
        --scalar-background-2: var(--bg);
        --scalar-background-3: var(--surface-raised);
        --scalar-background-accent: var(--surface-raised);
        --scalar-color-1: var(--ink);
        --scalar-color-2: var(--ink-muted);
        --scalar-color-3: var(--ink-faint);
        --scalar-color-accent: var(--link);
        --scalar-border-color: var(--border);

        --scalar-color-green: var(--spectrum-green);
        --scalar-color-red: var(--spectrum-red);
        --scalar-color-yellow: var(--spectrum-yellow);
        --scalar-color-blue: var(--spectrum-blue);
        --scalar-color-orange: var(--spectrum-orange);
        --scalar-color-purple: var(--spectrum-violet);

        /* The "core" button: black on light, white on dark, as on /pixel. */
        --scalar-button-1: var(--core);
        --scalar-button-1-hover: var(--core);
        --scalar-button-1-color: var(--bg);
      }

      .light-mode .t-doc__sidebar,
      .dark-mode .t-doc__sidebar {
        --scalar-sidebar-background-1: var(--bg);
        --scalar-sidebar-color-1: var(--ink);
        --scalar-sidebar-color-2: var(--ink-muted);
        --scalar-sidebar-border-color: var(--border);
        --scalar-sidebar-item-hover-background: var(--surface-raised);
        --scalar-sidebar-item-hover-color: currentColor;
        --scalar-sidebar-item-active-background: var(--surface-raised);
        --scalar-sidebar-color-active: var(--ink);
        --scalar-sidebar-indent-border: var(--border);
        --scalar-sidebar-indent-border-hover: var(--border-strong);
        --scalar-sidebar-indent-border-active: var(--link);
        --scalar-sidebar-search-background: transparent;
        --scalar-sidebar-search-color: var(--ink-faint);
        --scalar-sidebar-search-border-color: var(--border);
      }

      /* Flat on light (a hard offset, not a blur), a thin ring on dark. */
      .light-mode {
        --scalar-shadow-1: 2px 2px 0 0 var(--border);
      }
      .dark-mode {
        --scalar-shadow-1: 0 0 0 1px var(--border);
      }

      /* The API title is the one place the display face earns its keep. */
      .scalar-app h1 {
        font-family: "Pixelify Sans", var(--scalar-font);
        letter-spacing: 0.01em;
      }

      /*
       * Scalar's "Generate SDKs & MCP" upsell in the sidebar footer. There is
       * no config flag for it, so it goes by class; worst case on a version
       * bump the block reappears. The "Powered by Scalar" credit stays.
       */
      .explore-scalar {
        display: none;
      }

      /*
       * The intro's "Client Libraries" card, which picks the language for the
       * code samples. Every operation already has that picker next to its own
       * sample, where the choice is in context; the card just duplicates it
       * above a "Generate SDK" upsell.
       */
      .scalar-reference-intro-clients {
        display: none;
      }

      ::selection {
        background: var(--spectrum-magenta);
        color: var(--bg);
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <!--
      Pinned with an integrity hash. To bump, pick a version from
      https://www.npmjs.com/package/@scalar/api-reference and recompute:

        v=1.75.0
        curl -s "https://cdn.jsdelivr.net/npm/@scalar/api-reference@$v/dist/browser/standalone.js" \
          | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.75.0/dist/browser/standalone.js"
      integrity="sha384-xgelKlDcc+BYp0O+ZYzFesLnWCgGpEbXVVZWNQT6WyZYygN01tbEMygnjPXb5OPI"
      crossorigin="anonymous"
    ></script>
    <script>
      Scalar.createApiReference("#app", {
        // Relative: the site is published under /spacestate/ on Pages.
        url: "./openapi.yaml",
        // 'none' leaves the palette entirely to the CSS above.
        theme: "none",
        layout: "modern",
        darkMode: true,
        withDefaultFonts: false,
        metaData: { title: "Pixelbar spacestate API" },

        // Open, not folded away: this is a small API and the whole thing fits
        // in one scroll, so nothing is worth a click to reveal.
        defaultOpenAllTags: true,
        expandAllParameters: true,
        expandAllResponses: true,

        // The "Open API Client" launcher in the sidebar footer.
        hideClientButton: true,

        // Scalar otherwise invents a plausible-looking value for each
        // credential and puts it in the samples. Nobody can use those, and a
        // realistic-looking fake reads as a key someone leaked. Say what the
        // reader has to go and get instead.
        authentication: {
          securitySchemes: {
            bearerAuth: { token: "<your-api-key>" },
            legacyToken: { name: "token", in: "query", value: "<your-device-token>" },
          },
        },

        // showDeveloperTools is left at its default: on localhost only, so
        // `just dev` keeps them and the published site doesn't show them.
      });
    </script>
  </body>
</html>
