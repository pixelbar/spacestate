# Sample legacy device credentials for local development and tests.
# The token is the whole credential: there is no per-device IP allowlist. An
# `ip:` left over from the old format is still accepted and ignored, so live
# blobs keep working — drop it whenever convenient.
legacyDevices:
  - shortname: "Pixelbar Rotterdam"
    method: "Manual Switch"
    token: "dev-legacy-token-manual"
  - shortname: "Wireless Spacestate Button"
    method: "Spacestate Switch"
    token: "dev-legacy-token-button"
